name: eco_fun
description: "EcoFun — small daily climate actions for Rwanda: local environment news, AI quizzes, AI waste identification and community missions."
publish_to: 'none'
version: 1.1.0+2003

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend: auth, database, storage
  supabase_flutter: ^2.18.3
  google_sign_in: ^7.2.0

  # State management + navigation
  get: ^4.7.3

  # Device
  camera: ^0.12.2
  image_picker: ^1.2.4
  flutter_image_compress: ^2.5.1
  permission_handler: ^12.0.1
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.3

  # UI
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.2

  # Config + localisation
  flutter_dotenv: ^6.0.1
  easy_localization: ^3.0.8
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/config/.env
    - assets/translations/
  fonts:
    - family: ClimateCrisis
      fonts:
        - asset: assets/fonts/ClimateCrisis-Regular-VariableFont_YEAR.ttf
          weight: 400
